name: Pipeline

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Test und Build
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache für pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

  deploy:
    name: Deployment (Release)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Artifact herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/

      - name: Zugangsdaten prüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token-Länge: ${#DEPLOY_TOKEN}"
          echo "Ziel: ${{ vars.DEPLOY_TARGET }}"

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Automatisches Deployment aus GitHub Actions" \
            build/*.zip
